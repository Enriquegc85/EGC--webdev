<!DOCTYPE html>
<html lang="en">
    <head>
        <title>HTML Advanced Noted</title>
        <meta charset-="UTF-8">
        <style>
            /* Cascading Style sheets
            1. Selector=> says what to change 
            2. Declaration
                a. Property => What about the element to change
                b. Value => How to change it
            */
           /*Html tag selector*/ body{
              /*Declaration*/  color:rgb(191, 255, 0);
                                background-color: rgb(156, 70, 111);
                                border: inset 5px #3f6da1;
                                font-family: papyrus, fantasy;
                            font-weight: 900;
           
           
           
                        }
            h1{
                text-align: center;
            }
            #even{
                color:rgb(128, 72, 128);
                text-decoration: underline;
            }
            .lists{
                width: 50%;
                background-color:rgb(128, 77, 175);
                border-radius: 5px;
                font-size: 1.2rem;
            }
        </style>
    </head>
    <body>
        <h1>Html Advanced Notes</h1>
        <div class="lists">
        <h3> Lists:</h3>
        <ol type="I">
            <li>Alex</li>
            <li id="even">Katie</li>
            <li>Andrew</li>
            <liid="even">Vienna</li>
        </ol>
        <ul>
            <li><a href="https://www.pickpik.com/orchard-apple-apples-fruit-green-nature-10657#google_vignette" target="_blank">Apple</a></li>
            <li id="even">Orange</li>
            <li>Banana</li>
            <li id="even">Peach</li>
        </ul>
        <dl>
            <dt>Fall</dt>
            <dd id="even">Halloween</dd>
            <dd>Thanksgiving</dd>
            <dt id="even">Winter</dt>
            <dd>Christmas</dd>
            <dd id="even">Hanukkah</dd>
            <dd>New Years</dd>
        </dl>
        </div>

</html>
