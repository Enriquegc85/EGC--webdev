<!DOCTYPE html>
<html lang = "en">
    <head>
        <title>Color Theory CSS Styling with Color</title>
        <meta charset = "UTF-8">
    <style>
        .box {
            width: 14.5%;background-color: #0cb815; color: rgb(0, 0, 0); border: 5px solid red; border-radius: 10px; text-align: center;
        }

        .boxx {
            width: 14.5%;background-color: lch(53.23% 104.58 40); color: hsl(295, 100%, 50%); border: 5px solid hwb(34 2% 0%); border-radius: 10px; text-align: center;
        }
        .boxxx {
            width: 14.5%;background-color: rgb(255, 0, 0); color: rgb(0, 255, 0); border: 5px solid rgb(0, 0, 255); border-radius: 10px; text-align: center;
        }
    </style> 
    </head>
<body>
    <h1>Color Theory CSS Styling with Color</h1>
<div class="box">
    <h1>Complementary</h1>
</div>
<div class="boxx">
    <h1>Analogous</h1>
</div>
<div class="boxxx">
    <h1>Triadic</h1>
</div>


</body>
</html>
